{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button type="button" aria-label="More navigation links" aria-controls="navigation-overflow" aria-expanded="false"><span class="navicon" aria-hidden="true"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.name }}{% if site.name_zh %}<span class="masthead__name-zh" lang="zh-Hans">{{ site.name_zh }}</span>{% endif %}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul id="navigation-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
